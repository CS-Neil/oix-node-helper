version: 0.3.0+300

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  animations: ^2.1.1
  dynamic_color: ^1.8.1
  file_picker: ^10.3.3
